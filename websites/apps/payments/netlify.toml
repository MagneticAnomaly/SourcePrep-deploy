[build]
  base    = "websites/apps/payments"
  command = "cd ../../.. && npx turbo run build --filter=@codrag/payments"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Required environment variables (set in Netlify dashboard):
#   NEXT_PUBLIC_CODRAG_CHECKOUT_URL — Lemon Squeezy checkout URL
#   LEMONSQUEEZY_API_KEY            — (secret) API key for license recovery
#   LEMONSQUEEZY_STORE_ID           — Lemon Squeezy store ID
#   NEXT_PUBLIC_SITE_URL            — https://payments.codrag.io

[[plugins]]
  package = "@netlify/plugin-nextjs"
