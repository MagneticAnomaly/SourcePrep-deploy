[build]
  base    = "websites/apps/marketing"
  command = "cd ../../.. && npx turbo run build --filter=@prep/marketing"
  publish = "websites/apps/marketing/.next"

[build.environment]
  NODE_VERSION = "20"

# www → apex redirect
[[redirects]]
  from   = "https://www.sourceprep.io/*"
  to     = "https://sourceprep.io/:splat"
  status = 301
  force  = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
