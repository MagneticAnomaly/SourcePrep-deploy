[build]
  base    = "websites/apps/marketing"
  command = "cd ../../.. && npx turbo run build --filter=@prep/marketing"
  publish = ".next"
  # Deploy gate: skip this build unless the tip commit message contains
  # [deploy]. Prevents every push to main from deploying the site.
  # (Netlify skips the build when `ignore` exits 0.)
  ignore = '! git log -1 --pretty=%B | grep -qF "[deploy]"'

[build.environment]
  NODE_VERSION = "20"

# www → apex redirect
[[redirects]]
  from   = "https://www.sourceprep.io/*"
  to     = "https://sourceprep.io/:splat"
  status = 301
  force  = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
