[build]
  base    = "websites/apps/marketing"
  command = "cd ../../.. && npx turbo run build --filter=@codrag/marketing"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# www → apex redirect
[[redirects]]
  from   = "https://www.codrag.io/*"
  to     = "https://codrag.io/:splat"
  status = 301
  force  = true

# codrag.ai legacy redirect (if this site owns that domain too)
[[redirects]]
  from   = "https://codrag.ai/*"
  to     = "https://codrag.io/:splat"
  status = 301
  force  = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
