[build]
  base    = "websites/apps/marketing"
  command = "cd ../../.. && npx turbo run build --filter=@prep/marketing"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# www → apex redirect
[[redirects]]
  from   = "https://www.runprep.io/*"
  to     = "https://runprep.io/:splat"
  status = 301
  force  = true

#  legacy redirect (if this site owns that domain too)
[[redirects]]
  from   = ""
  to     = "https://runprep.io/:splat"
  status = 301
  force  = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
