[build]
  base    = "websites/apps/support"
  command = "cd ../../.. && npx turbo run build --filter=@prep/support"
  publish = ".next"
  # Deploy gate: skip this build unless the tip commit message contains
  # [deploy]. Prevents every push to main from deploying the site.
  # (Netlify skips the build when `ignore` exits 0.)
  ignore = '! git log -1 --pretty=%B | grep -qF "[deploy]"'

[build.environment]
  NODE_VERSION = "20"

# Required environment variables (set in Netlify dashboard):
#   ADMIN_TOKEN         — admin dashboard password (REQUIRED; if unset the
#                         admin area hard-denies with "Admin Not Configured").
#                         Use a long random value, e.g. `openssl rand -hex 32`.
#   GITHUB_TOKEN        — fine-grained PAT, read-only Discussions access
#   RESEND_API_KEY      — for bug report email notifications
#   BUG_REPORT_EMAIL    — destination address (default: bugs@sourceprep.io)
#   NEXT_PUBLIC_SITE_URL — https://support.sourceprep.io

[[plugins]]
  package = "@netlify/plugin-nextjs"
