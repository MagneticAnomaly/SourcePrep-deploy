name: Deploy Websites to Netlify

on:
  push:
    branches:
      - main
    paths:
      - 'websites/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/deploy-websites.yml'
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      marketing: ${{ steps.filter.outputs.marketing }}
      docs: ${{ steps.filter.outputs.docs }}
      storybook: ${{ steps.filter.outputs.storybook }}
      support: ${{ steps.filter.outputs.support }}
      payments: ${{ steps.filter.outputs.payments }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            marketing:
              - 'websites/apps/marketing/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            docs:
              - 'websites/apps/docs/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            storybook:
              - 'packages/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            support:
              - 'websites/apps/support/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            payments:
              - 'websites/apps/payments/**'
              - 'packages/ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'

  deploy-marketing:
    name: Deploy Marketing
    needs: changes
    if: needs.changes.outputs.marketing == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: |
          npm ci
          cd packages/ui && npm install @rollup/rollup-linux-x64-gnu --os=linux --cpu=x64 --no-save
      - name: Build Marketing
        run: npx turbo run build --filter=@prep/marketing
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_MARKETING_SITE_ID }}
        run: npx netlify-cli deploy --prod --dir=websites/apps/marketing/.next --filter=@prep/marketing

  deploy-docs:
    name: Deploy Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: |
          npm ci
          cd packages/ui && npm install @rollup/rollup-linux-x64-gnu --os=linux --cpu=x64 --no-save
      - name: Build Docs
        run: npx turbo run build --filter=@prep/docs
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_DOCS_SITE_ID }}
        run: npx netlify-cli deploy --prod --dir=websites/apps/docs/.next --filter=@prep/docs

  deploy-storybook:
    name: Deploy Storybook
    needs: changes
    if: needs.changes.outputs.storybook == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: |
          npm ci
          cd packages/ui && npm install @rollup/rollup-linux-x64-gnu --os=linux --cpu=x64 --no-save
      - name: Build Storybook
        env:
          # Hardens the build for public hosting: disables autodocs and
          # excludes internal-only stories. See packages/ui/.storybook/main.ts
          # and docs/Phase131_StorybookCuration/.
          STORYBOOK_PUBLIC: 'true'
        run: npx turbo run build-storybook --filter=@prep/ui
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_STORYBOOK_SITE_ID }}
        run: npx netlify-cli deploy --prod --dir=packages/ui/storybook-static --filter=@prep/ui

