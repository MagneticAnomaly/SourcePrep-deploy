name: Feature request
description: Suggest an improvement to Prep
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea.

        Please search existing issues to see if this has already been requested.
        If your idea is still rough or you just want to discuss it first, consider opening a Discussion instead:
        https://github.com/MagneticAnomaly/Prep/discussions

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what’s blocking you?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you’ve tried.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, screenshots, prior art, etc.
