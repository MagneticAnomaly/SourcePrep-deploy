[package]
name = "prep-engine"
description = "PyO3 Python bindings for the CoDRAG Rust engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "prep_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24.1", features = ["extension-module"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

prep-walker = { path = "../prep-walker" }
prep-parser = { path = "../prep-parser" }
prep-graph = { path = "../prep-graph" }
prep-sanitize = { path = "../prep-sanitize" }
prep-chunking = { path = "../prep-chunking" }
