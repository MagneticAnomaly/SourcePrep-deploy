[workspace]
resolver = "2"
members = [
    "crates/prep-walker",
    "crates/prep-parser",
    "crates/prep-graph",
    "crates/prep-sanitize",
    "crates/prep-chunking",
    "crates/prep-engine",
    "crates/prep-selfheal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Prep Team"]

[workspace.dependencies]
# Shared deps pinned at workspace level
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
blake3 = "1"
ignore = "0.4"
thiserror = "2"
log = "0.4"
regex = "1"
unicode-normalization = "0.1"
once_cell = "1"
rustc-hash = "2"
sha2 = "0.10"
