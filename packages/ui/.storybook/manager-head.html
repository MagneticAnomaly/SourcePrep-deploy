<!--
  Phase 131: visual polish on the Storybook manager (sidebar / top bar).
  See docs/Phase131_StorybookCuration/02_visual_design_plan.md.
-->
<script>
  // Force the addons panel closed AND docked to the bottom on each manager
  // load. setConfig({ showPanel: false, panelPosition: 'bottom' }) only seeds
  // the initial default; once a user toggles or drags, the preference sticks
  // in localStorage and overrides setConfig forever after. We patch any
  // persisted Storybook UI state before the manager reads it.
  //
  // Storybook 7 uses different localStorage keys across versions
  // (@storybook/manager/store on 7.6, @storybook/ui:settings on earlier),
  // so we scan every key that mentions "storybook" rather than guessing.
  try {
    function patchOne(raw) {
      var s;
      try { s = JSON.parse(raw); } catch (e) { return null; }
      if (!s || typeof s !== 'object') return null;
      var dirty = false;
      function patchLayout(layout) {
        if (!layout || typeof layout !== 'object') return;
        if (layout.showPanel === true) { layout.showPanel = false; dirty = true; }
        if (layout.panelPosition && layout.panelPosition !== 'bottom') {
          layout.panelPosition = 'bottom'; dirty = true;
        }
      }
      patchLayout(s.layout);
      patchLayout(s);
      // Some versions nest it under .state or similar.
      if (s.state) patchLayout(s.state.layout || s.state);
      return dirty ? JSON.stringify(s) : null;
    }
    for (var i = 0; i < window.localStorage.length; i++) {
      var key = window.localStorage.key(i);
      if (!key || !/storybook/i.test(key)) continue;
      var raw = window.localStorage.getItem(key);
      if (!raw) continue;
      var patched = patchOne(raw);
      if (patched) window.localStorage.setItem(key, patched);
    }
  } catch (e) { /* localStorage unavailable */ }
</script>
<style>
  /*
    Brand image — iOS-app-icon styling.
    Wrap the SourcePrep wordmark in a rounded-square dark-blue tile that
    matches the Slate Developer dark-mode background (#0F172A).
  */
  a[href="https://sourceprep.io"] img,
  [class*="Brand"] img,
  .sidebar-header img,
  .sidebar-container img {
    background-color: #0F172A;
    border-radius: 10px;
    padding: 6px;
    box-sizing: border-box;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
  }

  /*
    The shortcut button's final placement is set inline via JS (position:
    fixed + computed coordinates from the sidebar's bounding rect). No
    CSS class-based anchor — DOM-positioning approaches were defeated by
    a multi-level flex column wrapping the brand row that put the button
    at logo-mid instead of panel-top.
  */
</style>
<script>
  // Pin the Storybook "shortcuts / menu" button to the top-right corner of
  // the sidebar using fixed positioning. Coordinates come from the sidebar
  // element's bounding rect, so it lands at the actual visual corner
  // regardless of the manager's flex/CSS-in-JS structure.
  (function () {
    var SHORTCUT_BUTTON_TITLE_RE = /shortcut|menu/i;
    var TOP_PAD = 12;
    var RIGHT_PAD = 12;

    function findShortcutButton() {
      var candidates = document.querySelectorAll('button[title], button[aria-label]');
      for (var i = 0; i < candidates.length; i++) {
        var b = candidates[i];
        var label = (b.getAttribute('title') || '') + ' ' + (b.getAttribute('aria-label') || '');
        if (SHORTCUT_BUTTON_TITLE_RE.test(label)) return b;
      }
      var brand = document.querySelector('a[href="https://sourceprep.io"]');
      if (brand && brand.parentElement) {
        var sibBtn = brand.parentElement.querySelector('button');
        if (sibBtn) return sibBtn;
      }
      return null;
    }

    function findSidebar() {
      // Storybook 7's sidebar wraps its content in <nav>; fall back to any
      // element that contains the brand link if <nav> is unavailable.
      var nav = document.querySelector('nav');
      if (nav) return nav;
      var brand = document.querySelector('a[href="https://sourceprep.io"]');
      return brand ? brand.closest('div') : null;
    }

    function placeShortcut() {
      var btn = findShortcutButton();
      var sidebar = findSidebar();
      if (!btn || !sidebar) return;
      var rect = sidebar.getBoundingClientRect();
      // No sidebar visible (collapsed) — leave button alone.
      if (rect.width < 8) return;

      // Measure the button's natural width once before moving (afterwards
      // its parent changes and offsetWidth would be relative to body).
      var btnW = btn.offsetWidth || 28;
      btn.style.position = 'fixed';
      btn.style.top = (rect.top + TOP_PAD) + 'px';
      btn.style.left = (rect.right - btnW - RIGHT_PAD) + 'px';
      btn.style.zIndex = '999';
      btn.style.margin = '0';
    }

    function start() {
      placeShortcut();
      var observer = new MutationObserver(placeShortcut);
      observer.observe(document.body, { childList: true, subtree: true, attributes: true });
      window.addEventListener('resize', placeShortcut);
      // Re-poll for ~3s after load to catch async manager renders.
      var n = 0;
      var iv = setInterval(function () {
        placeShortcut();
        if (++n > 12) clearInterval(iv);
      }, 250);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
</script>
